name: Bug report
description: Something in a Salmon UI package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues must not be reported here: see [SECURITY.md](https://github.com/hy-ong/salmonui/blob/main/SECURITY.md).
  - type: input
    id: packages
    attributes:
      label: Package and version
      description: Every `@salmonui/*` package shares one version.
      placeholder: "@salmonui/data-grid 0.2.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or a link to a reproduction (StackBlitz, CodeSandbox, a repository).
      render: tsx
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: React version, framework (Next.js, Vite, ...), browser and OS.
      placeholder: "React 19.2, Next.js 16, Chrome 131, macOS 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Console errors, screenshots, server rendering or hydration warnings.
