name: Feature request
description: Suggest a new component, option or improvement.
labels: [enhancement]
body:
  - type: input
    id: area
    attributes:
      label: Package or component
      placeholder: "@salmonui/navigation/sidebar-menu"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
