- grid "Salmon UI Data Grid · 8 × 7":
  - rowgroup:
    - row "ID Select all rows Text 0 Text 1 Text 2 Text 3 Number 4":
      - columnheader "ID":
        - text: ""
        - button "Resize ID"
      - columnheader "Select all rows":
        - checkbox "Select all rows" [checked=mixed]
      - columnheader "Text 0":
        - text: ""
        - button "Resize Text 0"
      - columnheader "Text 1":
        - text: ""
        - button "Resize Text 1"
      - columnheader "Text 2":
        - text: ""
        - button "Resize Text 2"
      - columnheader "Text 3":
        - text: ""
        - button "Resize Text 3"
      - columnheader "Number 4":
        - text: ""
        - button "Resize Number 4"
  - rowgroup:
    - row /r0 Select row word-\d+-\d+ word-\d+-\d+ word-3i-\d+ word-\d+[hmsp]+-\d+ \d+,\d+/:
      - gridcell "r0"
      - gridcell "Select row":
        - checkbox "Select row"
      - gridcell /word-\d+-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /word-3i-\d+/
      - gridcell /word-\d+[hmsp]+-\d+/
      - gridcell /\d+,\d+/
    - row /r1 Select row word-1r-\d+ word-\d+-\d+ word-5l-\d+ word-\d+-\d+ \d+,\d+/ [selected]:
      - gridcell "r1"
      - gridcell "Select row":
        - checkbox "Select row" [checked]
      - gridcell /word-1r-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /word-5l-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /\d+,\d+/
