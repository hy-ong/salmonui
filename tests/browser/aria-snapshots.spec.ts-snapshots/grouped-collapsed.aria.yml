- grid /Salmon UI Data Grid · \d+ × 6/:
  - rowgroup:
    - row "ID Text 0 Text 1 Text 2 Text 3 Number 4":
      - columnheader "ID":
        - text: ""
        - button "Group by ID"
        - button "Resize ID"
      - columnheader "Text 0":
        - text: ""
        - button "Ungroup by Text 0" [pressed]
        - button "Resize Text 0"
      - columnheader "Text 1":
        - text: ""
        - button "Group by Text 1"
        - button "Resize Text 1"
      - columnheader "Text 2":
        - text: ""
        - button "Group by Text 2"
        - button "Resize Text 2"
      - columnheader "Text 3":
        - text: ""
        - button "Group by Text 3"
        - button "Resize Text 3"
      - columnheader "Number 4":
        - text: ""
        - button "Group by Number 4"
        - button "Resize Number 4"
  - rowgroup:
    - 'row /Expand Text 0 word-1g-\d+ Text 0: word-1g-\d+ - 1 item/':
      - 'gridcell /Expand Text 0 word-1g-\d+ Text 0: word-1g-\d+ - 1 item/':
        - button /Expand Text 0 word-1g-\d+/
        - text: ""
    - 'row /Collapse Text 0 word-1r-\d+ Text 0: word-1r-\d+ - 1 item/':
      - 'gridcell /Collapse Text 0 word-1r-\d+ Text 0: word-1r-\d+ - 1 item/ [expanded]':
        - button /Collapse Text 0 word-1r-\d+/ [expanded]
        - text: ""
    - row /r1 word-1r-\d+ word-\d+-\d+ word-5l-\d+ word-\d+-\d+ \d+,\d+/:
      - gridcell "r1"
      - gridcell /word-1r-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /word-5l-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /\d+,\d+/
    - 'row /Collapse Text 0 word-\d+-6 Text 0: word-\d+-6 - 1 item/':
      - 'gridcell /Collapse Text 0 word-\d+-6 Text 0: word-\d+-6 - 1 item/ [expanded]':
        - button /Collapse Text 0 word-\d+-6/ [expanded]
        - text: ""
    - row /r6 word-\d+-6 word-x-\d+ word-c-\d+ word-6z-\d+ \d+,\d+/:
      - gridcell "r6"
      - gridcell /word-\d+-6/
      - gridcell /word-x-\d+/
      - gridcell /word-c-\d+/
      - gridcell /word-6z-\d+/
      - gridcell /\d+,\d+/
    - 'row /Collapse Text 0 word-\d+-\d+ Text 0: word-\d+-\d+ - 1 item/':
      - 'gridcell /Collapse Text 0 word-\d+-\d+ Text 0: word-\d+-\d+ - 1 item/ [expanded]':
        - button /Collapse Text 0 word-\d+-\d+/ [expanded]
        - text: ""
    - row /r0 word-\d+-\d+ word-\d+-\d+ word-3i-\d+ word-\d+[hmsp]+-\d+ \d+,\d+/:
      - gridcell "r0"
      - gridcell /word-\d+-\d+/
      - gridcell /word-\d+-\d+/
      - gridcell /word-3i-\d+/
      - gridcell /word-\d+[hmsp]+-\d+/
