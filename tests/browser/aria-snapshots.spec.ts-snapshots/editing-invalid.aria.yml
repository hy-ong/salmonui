- row /r2 word-6e-\d+ This field is required\. word-8-\d+ word-5j-\d+ \d+/:
  - gridcell "r2"
  - gridcell /word-6e-\d+/:
    - textbox "Text 0": /word-6e-\d+/
  - gridcell "This field is required." [invalid]:
    - textbox "Text 1" [invalid]
    - text: ""
  - gridcell /word-8-\d+/:
    - textbox "Text 2": /word-8-\d+/
  - gridcell /word-5j-\d+/:
    - textbox "Text 3": /word-5j-\d+/
  - gridcell /\d+/:
    - textbox "Number 4": /\d+/