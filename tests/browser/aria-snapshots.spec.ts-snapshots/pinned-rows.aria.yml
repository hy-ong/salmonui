- grid /Salmon UI Data Grid · \d+ × 6/:
  - rowgroup:
    - row "ID Text 0 Text 1 Text 2 Text 3 Number 4":
      - columnheader "ID":
        - text: ""
        - button "Resize ID"
      - columnheader "Text 0":
        - text: ""
        - button "Resize Text 0"
      - columnheader "Text 1":
        - text: ""
        - button "Resize Text 1"
      - columnheader "Text 2":
        - text: ""
        - button "Resize Text 2"
      - columnheader "Text 3":
        - text: ""
        - button "Resize Text 3"
      - columnheader "Number 4":
        - text: ""
        - button "Resize Number 4"
  - rowgroup:
    - row /r9 word-6f-\d+ word-q-\d+ word-4x-\d+ word-[\d,.]+[bkmBKM]+-\d+ \d+,\d+/:
      - gridcell "r9"
      - gridcell /word-6f-\d+/
      - gridcell /word-q-\d+/
      - gridcell /word-4x-\d+/
      - gridcell /word-[\d,.]+[bkmBKM]+-\d+/
      - gridcell /\d+,\d+/
    - row /r0 word-\d+-\d+ word-\d+-\d+ word-3i-\d+ word-\d+[hmsp]+-\d+ \d+,\d+/:
      - gridcell "r0"
      - gridcell /word-\d+-\d+/
